<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f8"><title>Taskhub · Sidebar</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
<div class="shell">
  <header class="head">
    <div class="brand"><span class="mark">✦</span><div><strong>taskhub</strong><small id="subheading">今天，专注眼前</small></div></div>
    <div class="head-controls"><button class="lang" id="language" title="切换语言 / Language">EN</button><button class="square" id="openWindow" title="独立窗口 / New window" aria-label="独立窗口">▢</button></div>
  </header>
  <section class="hero">
    <div class="hero-top"><div><span class="eyebrow" id="dateLabel">TODAY</span><h1 id="heroDate">今天</h1></div><button class="new" id="newTask">＋ <span id="newLabel">新建</span></button></div>
    <div class="stat-grid"><div class="stat"><span id="pendingCount">0</span><small id="pendingLabel">待完成</small></div><div class="stat"><span id="doneCount">0</span><small id="doneLabel">已完成</small></div><div class="stat"><span id="missedCount">0</span><small id="missedLabel">已标未完成</small></div></div>
  </section>
  <section class="calendar-card"><div class="calendar-header"><strong id="monthName">2026 年 11 月</strong><div class="arrows"><button id="prevMonth" aria-label="上个月">‹</button><button id="toToday" aria-label="回到今天">●</button><button id="nextMonth" aria-label="下个月">›</button></div></div><div class="weekday" id="weekdays"></div><div class="month-grid" id="monthGrid"></div><div class="calendar-help" id="calendarHelp">点击日期查看日程 · 待办过期后自动顺延</div></section>
  <section class="tasks"><div class="task-head"><strong id="selectedHeading">今日事项</strong><span class="hint" id="taskCaption">0 项日程</span></div><div id="taskList"></div></section>
  <section class="missed-area" id="missedArea" hidden><div class="task-head"><strong id="missedHeading">已标记未完成</strong></div><div id="missedList"></div></section>
  <footer><button id="fullBoard">▦ <span id="fullLabel">打开完整日历</span></button><span id="saveHint">与主看板自动同步</span></footer>
</div>
<div class="overlay" id="quickOverlay" hidden><form class="quick-form" id="quickForm"><div class="form-title"><strong id="quickTitle">快速新建日程</strong><button type="button" id="closeQuick" aria-label="关闭">×</button></div><label id="labelTitle" for="titleInput">日程名称</label><input id="titleInput" maxlength="100" required placeholder="输入任务名称"><div class="dates"><div><label id="labelStart" for="startInput">开始日期</label><input type="date" id="startInput" required></div><div><label id="labelEnd" for="endInput">结束日期</label><input type="date" id="endInput" required></div></div><label id="labelCategory" for="categoryInput">分类</label><select id="categoryInput"></select><label class="important-quick" for="importantInput"><input type="checkbox" id="importantInput"><span id="importantLabel">⭐ 标记为重要任务</span></label><p id="repeatTip">重复规则可在完整看板中设置。</p><button type="submit" class="save" id="saveQuick">保存日程</button></form></div>
<div id="toast" role="status"></div>
<script src="sidepanel.js" defer></script>
</body></html>
